spring.application.name=Ayurnexa
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ayurnexa}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.api-key=${API_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
payu.client-id=${PAYU_CLIENT_ID:}
payu.client-secret=${PAYU_CLIENT_SECRET:}
payu.merchant-id=${PAYU_MERCHANT_ID:}
payu.merchant-key=${PAYU_MERCHANT_KEY:}
payu.merchant-salt=${PAYU_MERCHANT_SALT:}
payu.environment=${PAYU_ENVIRONMENT:uat}


google.client-id=129006707984-f5q28bqbnr6an15a7dqdrrkodd1le1r9.apps.googleusercontent.com

# Supabase Storage
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.service-role-key=${SUPABASE_SECRET_KEY:}
supabase.jwks-url=${SUPABASE_JWKS_URL:}
supabase.bucket=${SUPABASE_BUCKET:Ayurnexa}
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:${SUPABASE_URL:}/storage/v1/s3}
supabase.s3.access-key-id=${SUPABASE_S3_ACCESS_KEY_ID:${SupabaseS3acceskeyid:}}
supabase.s3.secret-access-key=${SUPABASE_S3_SECRET_ACCESS_KEY:${supabaseS3accesssecretkey:}}
supabase.s3.region=${SUPABASE_S3_REGION:${supabaseS3region:}}

# Mail (SMTP) - uses a free SMTP provider or your own mail server; no third-party email API required
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
