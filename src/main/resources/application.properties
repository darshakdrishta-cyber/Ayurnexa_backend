spring.application.name=Ayurnexa
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ayurnexa}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.api-key=${API_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.callback-url=${RAZORPAY_CALLBACK_URL:}
razorpay.link-expiry-minutes=${RAZORPAY_LINK_EXPIRY_MINUTES:30}


google.client-id=129006707984-f5q28bqbnr6an15a7dqdrrkodd1le1r9.apps.googleusercontent.com

# Supabase Storage
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.service-role-key=${SUPABASE_SECRET_KEY:}
supabase.jwks-url=${SUPABASE_JWKS_URL:}
supabase.bucket=${SUPABASE_BUCKET:products}

# Mail (SMTP) - uses a free SMTP provider or your own mail server; no third-party email API required
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

